services:
  database:
    image: postgres:16
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=laundry_api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - lavi_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lavi-redis
    ports:
      - "6379:6379"
    networks:
      - lavi_backend

  api:
    build:
      context: ./api
    env_file: ./api/.env.production
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - redis
    networks:
      - lavi_backend

  realtime:
    build:
      context: ./realtime
    env_file: ./realtime/.env.production
    environment:
      - API_ADDR=api
    ports:
      - "${WS_PORT}:${WS_PORT}"
    depends_on:
      - api
      - redis
    networks:
      - lavi_backend

volumes:
  lavi_data:
