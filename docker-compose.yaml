services:
  database:
    container_name: lavi_postgres
    image: postgres:16
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=lavi_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - lavi_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lavi-redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - lavi_backend

  api:
    container_name: lavi-api
    build:
      context: ./api
    env_file: ./api/.env.production
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    networks:
      - lavi_backend

  realtime:
    container_name: lavi-realtime
    build:
      context: ./realtime
    env_file: ./realtime/.env.production
    environment:
      - API_ADDR=api
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
    ports:
      - "${WS_PORT}:${WS_PORT}"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - lavi_backend

  worker:
    container_name: lavi-worker
    build:
      context: ./worker/
    env_file: ./worker/.env.production
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - WS_ADDR=realtime
      - WS_PORT=${WS_PORT}
    depends_on:
      redis:
        condition: service_started
      realtime:
        condition: service_started

volumes:
  lavi_data:

networks:
  lavi_backend:
    name: lavi_backend
    driver: bridge
